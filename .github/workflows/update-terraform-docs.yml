name: "update-terraform-docs"

on:
  push:
    branches: [main]
    paths:
      - "**.tf"
      - "**README.yml"
      - "**.terraform-docs.yml"
  schedule:
    - cron: "0 2 1 * *"
  workflow_dispatch:

jobs:
  update-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate Terraform docs (recursive)
        uses: rafalmasiarek/terraform-docs-action@latest
        with:
          working-dir: .
          config-file: .terraform-docs.yml
          output-file: docs/terraform.md
          output-method: replace
          recursive: true
          recursive-path: modules

      - name: Generate READMEs
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/rafalmasiarek/readme-gen/main/bin/readmegen -o /tmp/readmegen
          curl -fsSL https://raw.githubusercontent.com/rafalmasiarek/readme-gen/main/README.md.template -o /tmp/README.md.template
          chmod +x /tmp/readmegen
          find . -name README.yml -not -path '*/.terraform/*' | while read -r f; do
            dir=$(dirname "$f")
            /tmp/readmegen --config "$f" --template /tmp/README.md.template --output "$dir/README.md" --version main
          done

      - name: Git Auto-Commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: auto-update README.md and docs/terraform.md [skip ci]"
          commit_options: "--no-verify --signoff"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <actions@github.com>"
          file_pattern: "README.md docs/terraform.md modules/**/README.md modules/**/docs/terraform.md"
