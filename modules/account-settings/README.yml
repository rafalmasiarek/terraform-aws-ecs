name: terraform-aws-ecs/modules/account-settings
repo_url: https://github.com/rafalmasiarek/terraform-aws-ecs
license: MIT

context:
  - "## About"
  - |
    Sets account-wide, per-Region `aws_ecs_account_setting_default`
    opt-ins (`containerInsights`, `awsvpcTrunking`, `defaultLogDriverMode`,
    `dualStackIPv6`, `fargateFIPSMode`, `fargateTaskRetirementWaitPeriod`,
    `fargateEventWindows`) - explicit allow-list, immutable/AWS-managed
    settings excluded. Called internally by the root
    [terraform-aws-ecs](../../) module - not meant to be called standalone.

includes:
  - docs/usage.md
  - docs/terraform.md

