name: terraform-aws-ecs/modules/addons
repo_url: https://github.com/rafalmasiarek/terraform-aws-ecs
license: MIT

context:
  - "## About"
  - |
    Optional ECS cluster add-ons: Traefik ingress, OpenTelemetry collector,
    CloudWatch agent, node_exporter, cAdvisor, Falco, blackbox_exporter,
    and an observability preset (dashboard, alarms, SNS, EventBridge
    rules). Called internally by the root [terraform-aws-ecs](../../)
    module via `var.cluster_addons` - not meant to be called standalone.

includes:
  - docs/usage.md
  - docs/terraform.md

